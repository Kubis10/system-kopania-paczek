name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend
      - run: npm --prefix backend test
      - run: npm --prefix backend run build
      - run: npm --prefix frontend exec -- tsc --noEmit -p frontend/tsconfig.json
      - run: npm --prefix frontend run lint
      - run: npm audit --omit=dev --audit-level=high --prefix backend
      - run: npm audit --omit=dev --audit-level=high --prefix frontend
      - name: Build production containers
        run: docker compose build

  static-analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v3
      - name: Scan repository for secrets
        run: docker run --rm -v "$PWD:/path" ghcr.io/gitleaks/gitleaks:latest detect --source=/path --no-git --exit-code=1

  container-scan:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build --tag courier-backend:${{ github.sha }} ./backend
      - name: Build frontend image
        run: docker build --build-arg API_URL=http://backend:4000 --tag courier-frontend:${{ github.sha }} ./frontend
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: courier-backend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: courier-frontend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
